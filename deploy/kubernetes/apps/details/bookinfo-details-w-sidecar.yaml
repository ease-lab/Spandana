apiVersion: apps/v1
kind: Deployment
metadata:
  name: details
  labels:
    app: details
    version: v1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
    spec:
      serviceAccountName: details-sa

      securityContext:
        runAsUser: 0  # Run as root

      initContainers:
      - name: init-networking
        image: ghcr.io/ease-lab/spandana/port-forwarder:latest
        imagePullPolicy: Always
        env:
          - name: DPORT
            value: "9080"
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
          privileged: true

      containers:
      - name: proxy
        image: ghcr.io/ease-lab/spandana/slo-director:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
        resources:
          requests:
            cpu: "0.5"
        env:
          - name: VM_BACKEND_URL
            value: "http://localhost"
          - name: VM_BACKEND_PORT
            value: "9080"
          - name: SERVERLESS_URL
            valueFrom:
              secretKeyRef:
                name: spandana-serverless-backends
                key: details-url
          - name: SERVERLESS_PORT
            value: "80"
          - name: PROXY_PORT
            value: "8000"
          - name: RATE_LIMIT
            value: "240"
          - name: QUEUE_SIZE
            value: "9"
          - name: LATENCY_SLO_MS
            value: "100"
          - name: SLO_PASS_THRESHOLD
            value: "100"
          - name: SLO_VIOLATION_THRESHOLD
            value: "100"
          - name: RING_SIZE
            value: "120"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: DEPLOYMENT_NAME
            value: "details"
          - name: SRO_INGEST_URL
            valueFrom:
              configMapKeyRef:
                name: spandana-sro-endpoints
                key: details
        volumeMounts:
          - name: efs-volume
            mountPath: /app/logs

      - name: details
        image: ghcr.io/ease-lab/spandana/details:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 9080
        env:
          - name: AWS_REGION
            value: "us-east-1"
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: DEPLOYMENT_NAME
            value: "details"
        lifecycle:
          preStop:
            exec:
          # Keep the pod alive for 30 seconds to allow the ALB
          # to deregister the target gracefully.
              command: ["/bin/sh", "-c", "sleep 10"]

        
        resources:
          requests:
            cpu: "1"
          limits:
            cpu: "1"
        volumeMounts:
          - name: efs-volume
            mountPath: /app/app_logs

      volumes:
        - name: efs-volume
          persistentVolumeClaim:
            claimName: efs-claim
