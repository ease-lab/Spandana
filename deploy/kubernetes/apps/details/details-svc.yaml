apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: details-ingress
  annotations:
    # kubernetes.io/ingress.class: alb

    # ALB Configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http2.enabled=false
    # Health Check Configuration
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: '9080'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: '200'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: details
                port:
                  number: 9080
# ---
# apiVersion: v1
# kind: Service
# metadata:
#   name: details-nodeport
#   labels:
#     app: details
# spec:
#   type: NodePort
#   externalTrafficPolicy: Local
#   selector:
#     app: details
#   ports:
#     - name: http
#       port: 80           # Internal service port
#       targetPort: 9080   # Container's exposed port
#       protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: details
  labels:
    app: details
    service: details
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
